# Sin default para la contraseña: nunca debe tener un valor utilizable
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATASOURCE_USER:appuser}
spring.datasource.password=${DATASOURCE_PASSWORD:}
# update y no validate: validate falla con una BD vacia y no hay Flyway en el alcance
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.com.universidad.catalogo=INFO

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized